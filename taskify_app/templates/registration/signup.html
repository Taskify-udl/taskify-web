{% extends "base.html" %}
{% load static %}
{% block title %} Sign Up {% endblock %}

{% block content %}
    <section class="h-100 gradient-form">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-xl-10">
                    <div class="col-10 col-md-8 card rounded-3 text-black mx-auto">
                        <div class="row g-0">
                            <div class="card-body p-md-5 mx-md-4">
                                <div class="text-center">
                                    <img src="{% static 'images/logo.png' %}" style="width: 185px;" alt="logo">
                                    <h4 class="mt-1 mb-5 pb-1 bg-red">Sign Up</h4>
                                </div>
                                <form method="post" action="{% url 'signup' %}">
                                    {% csrf_token %}

                                    <div class="fx-input-container">
                                        <input
                                                type="text"
                                                name="username"
                                                id="username"
                                                class="form-control fx-input"
                                                placeholder=" "
                                                required
                                        />
                                        <label class="fx-label" for="username">Username</label>
                                        <span class="fx-underline"></span>
                                    </div>

                                    <div class="fx-input-container">
                                        <input
                                                type="email"
                                                name="email"
                                                id="email"
                                                class="form-control fx-input"
                                                placeholder=" "
                                                required
                                        />
                                        <label class="fx-label" for="email">Email address</label>
                                        <span class="fx-underline"></span>
                                    </div>

                                    <div class="fx-input-container">
                                        <input
                                                type="password"
                                                name="password1"
                                                id="password1"
                                                class="form-control fx-input"
                                                placeholder=" "
                                                required
                                        />
                                        <label class="fx-label" for="password1">Password</label>
                                        <span class="fx-underline"></span>
                                    </div>

                                    <div class="fx-input-container">
                                        <input
                                                type="password"
                                                name="password2"
                                                id="password2"
                                                class="form-control fx-input"
                                                placeholder=" "
                                                required
                                        />
                                        <label class="fx-label" for="password2">Confirm password</label>
                                        <span class="fx-underline"></span>
                                    </div>

                                    <!-- Error modal -->
                                    <div class="modal fade" id="exampleModal" tabindex="-1"
                                         aria-labelledby="exampleModalLabel" aria-hidden="true">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title" id="exampleModalLabel">Error</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                            aria-label="Close"></button>
                                                </div>
                                                <div class="modal-body">
                                                    {% if error_message %}
                                                        <p>{{ error_message }}</p>
                                                    {% endif %}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="text-center mt-2 mb-5 pb-1">
                                        <button class="mt-3 mx-auto btn btn-primary">
                                            Register
                                        </button>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
