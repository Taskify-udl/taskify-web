{% extends "base.html" %}
{% load static %}
{% block title %} Iniciar Sesión {% endblock %}
{% block content %}

    <section class="h-100 gradient-form">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-xl-10 row ">
                    <div class=" col-6 card rounded-3 text-black mx-auto">
                        <div class=" g-0">
                            <div class="">
                                <div class="card-body p-md-5 mx-auto">
                                    <div class="text-center">
                                        <img src="{% static 'images/logo.png' %}" style="width: 185px;" alt="logo">
                                        <h4 class="mt-1 mb-5 pb-1">Iniciar sesión</h4>
                                    </div>
                                    <form method="post" action="{% url 'login' %}">
                                        <form method="post" action="{% url 'login' %}">
                                            {% csrf_token %}
                                            <div class="fx-input-container">
                                                <input
                                                        type="text"
                                                        name="username"
                                                        id="login-username"
                                                        class="form-control fx-input {% if error_message %}is-invalid{% endif %}"
                                                        placeholder=" "
                                                        required
                                                        value="{{ request.POST.username|default:'' }}"
                                                />
                                                <label class="fx-label" for="login-username">Username</label>
                                                <span class="fx-underline"></span>
                                            </div>

                                            <div class="fx-input-container">
                                                <input
                                                        type="password"
                                                        name="password"
                                                        id="login-password"
                                                        class="form-control fx-input {% if error_message %}is-invalid{% endif %}"
                                                        placeholder=" "
                                                        required
                                                />
                                                <label class="fx-label" for="login-password">Password</label>
                                                <span class="fx-underline"></span>
                                            </div>

                                            <!-- Modal de error (igual que antes) -->
                                            <div class="modal fade" id="exampleModal" tabindex="-1"
                                                 aria-labelledby="exampleModalLabel" aria-hidden="true">
                                                <div class="modal-dialog">
                                                    <div class="modal-content">
                                                        <div class="modal-header">
                                                            <h5 class="modal-title" id="exampleModalLabel">Error</h5>
                                                            <button type="button" class="close pt-16px" data-dismiss="modal"
                                                                    aria-label="Close"><i class="fa fa-times"
                                                                                          aria-hidden="true"></i>
                                                            </button>

                                                        </div>
                                                        <div class="modal-body">
                                                            {% if error_message %}
                                                                <p>{{ error_message }}</p>
                                                            {% endif %}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="text-center mt-2 mb-5 pb-1">
                                                <button class="mt-3 mx-auto btn btn-primary">
                                                    Log in
                                                </button>
                                            </div>
                                        </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            {% if error_message %}
                var myModal = new bootstrap.Modal(document.getElementById('exampleModal'));
                myModal.show();
            {% endif %}
        });
    </script>

{% endblock %}
