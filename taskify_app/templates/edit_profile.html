{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Perfil - Taskify{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 p-4 lg:p-8">
    <div class="max-w-3xl mx-auto">
        <div class="flex items-center gap-3 mb-8">
            <a href="{% url 'profile' %}" class="inline-flex items-center justify-center w-10 h-10 bg-white hover:bg-gray-100 rounded-lg transition-colors shadow-sm border border-gray-200" style="text-decoration: none !important;">
                <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="text-3xl font-bold text-gray-900">Editar Perfil</h1>
        </div>

        
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <form method="post" enctype="multipart/form-data" class="p-8 lg:p-12">
                {% csrf_token %}
                
                <div class="mb-10 pb-10 border-b border-gray-200">
                    <h2 class="text-2xl font-bold text-gray-900 mb-8">Foto de Perfil</h2>
                    <div class="flex flex-col md:flex-row items-center md:items-center gap-8">
                        <div class="flex-shrink-0">
                            <img src="{{ profile.avatar_url }}" alt="Avatar actual" class="w-30 h-30 rounded-full object-cover ring-4 ring-gray-200 shadow-md mb-3">
                        </div>
                        <div class="flex-grow">
                            <label for="avatar" class="inline-block px-6 py-3 text-white rounded-lg font-semibold cursor-pointer transition-all shadow-md hover:shadow-lg hover:-translate-y-0.5" style="background-color: #000000 !important;">
                                Elegir nueva imagen
                            </label>
                            <input type="file" id="avatar" name="avatar" accept="image/*" class="hidden">
                            <p class="mt-3 text-sm text-gray-500">Formatos permitidos: JPG, PNG, GIF. Tamaño máximo: 5MB</p>
                        </div>
                    </div>
                </div>
              
                <div class="mb-10 pb-10 border-b border-gray-200 mx-3">
                    <h2 class="text-2xl font-bold text-gray-900 mb-8">Información Básica</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label for="first_name" class="block mb-3 font-semibold text-gray-700 text-sm">Nombre</label>
                            <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 focus:ring-4 focus:ring-gray-100 transition-all">
                        </div>

                        <div>
                            <label for="last_name" class="block mb-3 font-semibold text-gray-700 text-sm">Apellido</label>
                            <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 focus:ring-4 focus:ring-gray-100 transition-all">
                        </div>
                    </div>

                    <div>
                        <label for="email" class="block mb-3 font-semibold text-gray-700 text-sm">Email</label>
                        <input type="email" id="email" name="email" value="{{ user.email }}" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 focus:ring-4 focus:ring-gray-100 transition-all">
                    </div>

                    <div class="mt-6">
                        <label for="profession" class="block mb-3 font-semibold text-gray-700 text-sm">Profesión</label>
                        <input type="text" id="profession" name="profession" value="{{ profile.profession }}" placeholder="Tu profesión" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 focus:ring-4 focus:ring-gray-100 transition-all">
                    </div>
                </div>
              
                <div class="mb-8 mx-3">
                    <h2 class="text-2xl font-bold text-gray-900 mb-8">Información Adicional</h2>
                    
                    <div class="mb-6">
                        <label for="bio" class="block mb-3 font-semibold text-gray-700 text-sm">Biografía</label>
                        <textarea id="bio" name="bio" rows="4" placeholder="Cuéntanos sobre ti..." class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 focus:ring-4 focus:ring-gray-100 transition-all resize-y min-h-[120px]">{{ profile.bio }}</textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="phone" class="block mb-3 font-semibold text-gray-700 text-sm">Teléfono</label>
                            <input type="tel" id="phone" name="phone" value="{{ profile.phone }}" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 focus:ring-4 focus:ring-gray-100 transition-all">
                        </div>

                        <div>
                            <label for="location" class="block mb-3 font-semibold text-gray-700 text-sm">Ubicación</label>
                            <input type="text" id="location" name="location" value="{{ profile.location }}" placeholder="Ciudad, País" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 focus:ring-4 focus:ring-gray-100 transition-all">
                        </div>
                    </div>

                    <div class="mt-6 mb-3">
                        <label for="website" class="block mb-3 font-semibold text-gray-700 text-sm">Sitio Web</label>
                        <input type="url" id="website" name="website" value="{{ profile.website }}" placeholder="https://..." class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-gray-900 focus:ring-4 focus:ring-gray-100 transition-all">
                    </div>
                </div>
              
                <div class="flex flex-col-reverse md:flex-row gap-3 pt-8  justify-end mt-2 mb-2 mx-4">
                    <a href="{% url 'profile' %}" class="px-8 py-3 text-white rounded-lg font-semibold text-center hover:shadow-lg hover:-translate-y-0.5 transition-all" style="background-color: #dc2626 !important; text-decoration: none !important;">
                        Cancelar
                    </a>
                    <button type="submit" class="px-8 py-3 text-white rounded-lg font-semibold hover:shadow-lg hover:-translate-y-0.5 transition-all" style="background-color: #000000 !important;">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('avatar').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                document.querySelector('img[alt="Avatar actual"]').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    });
</script>
{% endblock %}
