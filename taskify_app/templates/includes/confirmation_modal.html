{% load json_i18n %}
<!-- Reusable Confirmation Modal -->
<div id="{{ modal_id|default:'confirmationModal' }}" class="fixed inset-0 z-[60] hidden" aria-labelledby="modal-title"
    role="dialog" aria-modal="true">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/50 transition-opacity"></div>

    <div class="fixed inset-0 z-10 overflow-y-auto">
        <div class="flex min-h-full items-center justify-center p-4">
            <!-- Modal content -->
            <div
                class="relative transform overflow-hidden rounded-3xl bg-gradient-to-br from-gray-50 to-gray-100 shadow-2xl transition-all w-full max-w-md">
                <div class="p-8">
                    <!-- Warning icon - top left -->
                    <div class="absolute top-6 left-6">
                        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-red-50">
                            <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                            </svg>
                        </div>
                    </div>

                    <!-- Content centered -->
                    <div class="text-center mt-8">
                        <h3 class="text-xl font-bold text-gray-900 mb-3"
                            id="{{ modal_id|default:'confirmationModal' }}-title">
                            {% t title %}
                        </h3>
                        <p class="text-sm text-gray-600 leading-relaxed"
                            id="{{ modal_id|default:'confirmationModal' }}-desc">
                            {% t description %}
                        </p>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="px-3 pb-3 flex gap-3">
                    <button type="button" id="{{ cancel_id|default:'cancelBtn' }}"
                        class="flex-1 px-6 py-3 text-sm font-semibold text-gray-700 bg-white !rounded-xl shadow-sm hover:bg-gray-50 transition-all border border-gray-200">
                        {% t cancel_text %}
                    </button>
                    <button type="button" id="{{ confirm_id|default:'confirmBtn' }}"
                        class="flex-1 px-6 py-3 text-sm font-semibold text-white bg-red-600 !rounded-xl shadow-sm hover:bg-red-700 transition-all">
                        {% t confirm_text %}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
